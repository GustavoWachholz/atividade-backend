services:
  api:
    build: ./backend
    environment:
      # o banco é o Supabase (Postgres), definido no .env da raiz
      URL_DO_BANCO: ${URL_DO_BANCO}
      CHAVE_DO_TOKEN: ${CHAVE_DO_TOKEN}
      ORIGEM_FRONTEND: http://localhost:8080

  web:
    build: ./frontend
    ports: ["8080:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api
